<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4d4d;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1"></stop>
    </linearGradient>
  </defs>

  <!-- Left angle bracket -->
  <polygon points="40,128 80,88 80,168" fill="#333333"></polygon>

  <!-- Right angle bracket -->
  <polygon points="216,128 176,88 176,168" fill="#333333"></polygon>

  <!-- JP letters -->
  <text x="128" y="160" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="120" text-anchor="middle" fill="url(#redGradient)">JP</text>
</svg>
